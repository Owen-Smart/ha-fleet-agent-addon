name: "HA Fleet Agent"
description: "Outbound-only fleet telemetry agent for the HA Fleet commercial PoC"
version: "0.1.2"
slug: "ha_fleet_agent"
init: false
startup: application
boot: auto
homeassistant_api: true
arch:
  - amd64
  - aarch64
options:
  backend_url: "https://fleet.example.com"
  site_code: "SITE-001"
  device_uid: "device-001"
  agent_key_id: "agent-001"
  agent_secret: ""
  heartbeat_seconds: 60
  verify_tls: true
  zigbee2mqtt_url: ""
  esphome_url: ""
schema:
  backend_url: url
  site_code: "match(^SITE-[0-9]{3}$)"
  device_uid: str
  agent_key_id: str
  agent_secret: password
  heartbeat_seconds: "int(15,3600)"
  verify_tls: bool
  zigbee2mqtt_url: "str?"
  esphome_url: "str?"
