name: "HA Fleet Manager"
description: "Lightweight remote access and maintenance console for Home Assistant sites"
version: "0.1.1"
slug: "ha_fleet_manager"
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8098
panel_icon: "mdi:tools"
arch:
  - amd64
  - aarch64
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Fleet Agent API (LAN evaluation only)"
options:
  offline_seconds: 150
  sites:
    - site_code: "SITE-001"
      site_name: "SITE-001"
      device_uid: "device-001"
      agent_key_id: "agent-001"
      agent_secret: ""
      remote_url: ""
schema:
  offline_seconds: "int(30,3600)"
  sites:
    - site_code: "match(^SITE-[0-9]{3}$)"
      site_name: str
      device_uid: str
      agent_key_id: str
      agent_secret: password
      remote_url: "str?"

